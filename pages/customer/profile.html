
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Manage your KARTO account details.">
    <title>My Profile | KARTO</title>

    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/customer.css">
</head>
<body>

    <main class="customer-page">

        <section class="customer-card">

            <div class="customer-heading">
                <p>MY ACCOUNT</p>
                <h1>Personal details</h1>
                <p>View and manage your account information.</p>
            </div>

            <form id="profile-form">

                <div class="form-group">
                    <label for="full-name">Full Name</label>
                    <input type="text" id="full-name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" disabled>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" required>
                </div>

                <p id="profile-message" role="alert"></p>

                <button type="submit" id="save-profile-button">
                    Save Changes
                </button>

            </form>

            <a href="dashboard.html">Back to Dashboard</a>

        </section>

    </main>
<script src="../../js/firebase/firebase-config.js"></script>
<script src="../../js/firebase/rest-client.js"></script>
<script src="../../js/auth/auth-service.js"></script>
<script src="../../js/auth/session-service.js"></script>
<script src="../../js/auth/profile-service.js"></script>
<script src="../../js/customer/profile.js"></script>

</body>
</html>
