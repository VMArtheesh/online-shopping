
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="View your KARTO order history.">
    <title>My Orders | KARTO</title>

    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/customer.css">
</head>
<body>

    <!-- Customer Navigation -->
    <header class="customer-header">

        <a href="../../index.html" class="customer-logo">KARTO</a>

        <nav class="customer-nav">
            <a href="../../index.html">Home</a>
            <a href="dashboard.html">My Account</a>
            <a href="profile.html">My Profile</a>
            <a href="orders.html" class="active">My Orders</a>
            <button type="button" id="logout-button">Logout</button>
        </nav>

    </header>

    <main class="dashboard-container">

        <!-- Page Heading -->
        <section class="dashboard-welcome">

            <div>
                <p class="dashboard-eyebrow">YOUR PURCHASES</p>
                <h1>My Orders</h1>
                <p class="dashboard-description">
                    View your order history and track your purchases.
                </p>
            </div>

            <a href="dashboard.html" class="profile-edit-link">
                Back to Account
            </a>

        </section>

        <!-- Orders Summary -->
        <section class="dashboard-section">

            <div class="dashboard-section-heading">
                <div>
                    <p class="dashboard-eyebrow">ORDER ACTIVITY</p>
                    <h2>Your Purchases</h2>
                </div>
            </div>

            <div id="customer-orders-message">
                Loading your orders...
            </div>

            <div id="customer-orders-container"></div>

        </section>

    </main>

    <!-- Firebase and Customer Scripts -->
    <script src="../../js/firebase/firebase-config.js"></script>
    <script src="../../js/firebase/rest-client.js"></script>
    <script src="../../js/auth/auth-service.js"></script>
    <script src="../../js/auth/session-service.js"></script>
    <script src="../../js/customer/orders.js"></script>
    <script src="../../js/customer/logout.js"></script>

</body>
</html>
