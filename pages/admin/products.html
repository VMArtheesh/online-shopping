
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Manage KARTO products.">
    <title>KARTO | Product Management</title>

    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/admin/admin.css">
</head>
<body>

    <header class="admin-header">
        <a href="dashboard.html" class="admin-logo">
            KARTO<span>.</span>
        </a>

        <div class="admin-header-right">
            <a href="dashboard.html">Dashboard</a>
            <span id="admin-name">Administrator</span>
            <button id="admin-logout" type="button">Logout</button>
        </div>
    </header>

    <main class="admin-dashboard">

        <section class="admin-welcome">
            <p class="admin-eyebrow">STORE MANAGEMENT</p>
            <h1>Products</h1>
            <p>Manage your product catalogue and availability.</p>
        </section>

        <section class="admin-products-section">
            <div class="admin-products-toolbar">
                <div id="admin-products-message">
                    Loading products...
                </div>

                <button id="add-product-button" type="button">
                    + Add Product
                </button>
            </div>
            <div id="add-product-modal" class="admin-product-modal" hidden>

            <div class="admin-product-form">

                <div class="admin-form-heading">
                    <div>
                        <p class="admin-eyebrow">CATALOGUE MANAGEMENT</p>
                        <h2>Add New Product</h2>
                    </div>

                    <button type="button" id="close-product-form">
                        &times;
                    </button>
                </div>

                <form id="add-product-form">

                    <div class="admin-form-group">
                        <label for="product-name">Product Name</label>
                        <input type="text" id="product-name" required>
                    </div>

                    <div class="admin-form-group">
                        <label for="product-category">Category</label>
                        <select id="product-category" required>
                            <option value="">Select Category</option>
                            <option>Clothing</option>
                            <option>Accessories</option>
                            <option>Home</option>
                            <option>Electronics</option>
                            <option>Beauty</option>
                            <option>Books</option>
                            <option>Stationery</option>
                            <option>Kitchen</option>
                            <option>Footwear</option>
                            <option>Bags</option>
                            <option>Fitness</option>
                            <option>Toys</option>
                            <option>Sports</option>
                            <option>Travel</option>
                            <option>Grocery</option>
                        </select>
                    </div>

                    <div class="admin-form-group">
                        <label for="product-description">Description</label>
                        <textarea id="product-description" rows="3"></textarea>
                    </div>

                    <div class="admin-form-grid">

                        <div class="admin-form-group">
                            <label for="product-price">Price (₹)</label>
                            <input type="number" id="product-price" min="0.01" step="0.01" required>
                        </div>

                        <div class="admin-form-group">
                            <label for="product-stock">Stock Quantity</label>
                            <input type="number" id="product-stock" min="0" step="1" required>
                        </div>

                    </div>

                    <div class="admin-form-group">
                        <label for="product-image">Product Image URL</label>
                        <input type="url" id="product-image" placeholder="https://example.com/image.jpg">
                    </div>

                    <div class="admin-form-actions">
                        <button type="button" id="cancel-product-form">
                            Cancel
                        </button>

                        <button type="submit" id="save-product-button">
                            Save Product
                        </button>
                    </div>

                </form>

            </div>

        </div>

<div class="admin-product-toolbar">

    <input
        type="search"
        id="product-search"
        placeholder="Search products..."
    >

    <select id="product-category-filter">
        <option value="">All Categories</option>
        <option value="Clothing">Clothing</option>
        <option value="Accessories">Accessories</option>
        <option value="Home">Home</option>
        <option value="Electronics">Electronics</option>
        <option value="Beauty">Beauty</option>
        <option value="Books">Books</option>
        <option value="Stationery">Stationery</option>
        <option value="Kitchen">Kitchen</option>
        <option value="Footwear">Footwear</option>
        <option value="Bags">Bags</option>
        <option value="Fitness">Fitness</option>
        <option value="Toys">Toys</option>
        <option value="Sports">Sports</option>
        <option value="Travel">Travel</option>
        <option value="Grocery">Grocery</option>
    </select>

</div>


            <div id="admin-products-container">
                <!-- Products will be loaded dynamically -->
            </div>

        </section>

    </main>

    <script src="../../js/firebase/firebase-config.js"></script>
    <script src="../../js/firebase/rest-client.js"></script>
    <script src="../../js/services/product-service.js"></script>
    <script src="../../js/auth/auth-service.js"></script>
    <script src="../../js/auth/session-service.js"></script>
    <script src="../../js/admin/admin-guard.js"></script>
    <script src="../../js/admin/products.js"></script>

</body>
</html>
