
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="KARTO admin inventory management.">

    <title>KARTO | Inventory Management</title>

    <link rel="stylesheet" href="../../css/admin/admin.css">
</head>

<body>

    <!-- ADMIN HEADER -->

    <header class="admin-header">

        <a href="dashboard.html" class="admin-logo">
            KARTO
        </a>

        <div class="admin-header-actions">
            <span id="admin-name"></span>

            <button id="admin-logout" type="button">
                Logout
            </button>
        </div>

    </header>

    <!-- INVENTORY CONTENT -->

    <main class="admin-main">

        <section class="admin-welcome">

            <div>
                <p class="admin-eyebrow">INVENTORY MANAGEMENT</p>

                <h1>Inventory</h1>

                <p>
                    Monitor stock levels and manage product inventory.
                </p>
            </div>

            <a href="dashboard.html" class="admin-back-link">
                Back to Dashboard
            </a>

        </section>

        <!-- INVENTORY SUMMARY -->

        <section class="inventory-summary">

            <div class="inventory-summary-card">
                <p>Total Products</p>
                <h2 id="total-products">0</h2>
            </div>

            <div class="inventory-summary-card">
                <p>Total Stock Units</p>
                <h2 id="total-stock">0</h2>
            </div>

            <div class="inventory-summary-card">
                <p>Low Stock</p>
                <h2 id="low-stock-count">0</h2>
            </div>

            <div class="inventory-summary-card">
                <p>Out of Stock</p>
                <h2 id="out-of-stock-count">0</h2>
            </div>
            <div class="inventory-summary-card">
                <p>High Stock</p>
                <h2 id="high-stock-count">0</h2>
            </div>

        </section>

        <!-- INVENTORY FILTERS -->

        <section class="inventory-section">

            <div class="inventory-heading">
                <h2>Stock Overview</h2>
                <p id="inventory-message">Loading inventory...</p>
            </div>

            <div class="inventory-toolbar">

                <input
                    type="search"
                    id="inventory-search"
                    placeholder="Search products..."
                >

                <select id="inventory-category-filter">
                    <option value="">All Categories</option>
                    <option value="Clothing">Clothing</option>
                    <option value="Accessories">Accessories</option>
                    <option value="Home">Home</option>
                    <option value="Electronics">Electronics</option>
                    <option value="Beauty">Beauty</option>
                    <option value="Books">Books</option>
                    <option value="Stationery">Stationery</option>
                    <option value="Kitchen">Kitchen</option>
                    <option value="Footwear">Footwear</option>
                    <option value="Bags">Bags</option>
                    <option value="Fitness">Fitness</option>
                    <option value="Toys">Toys</option>
                    <option value="Sports">Sports</option>
                    <option value="Travel">Travel</option>
                    <option value="Grocery">Grocery</option>
                </select>

            </div>

            <div id="inventory-container"></div>

        </section>

<!-- STOCK UPDATE MODAL -->

<div class="admin-modal" id="stock-update-modal">

    <div class="admin-modal-content">

        <div class="admin-modal-header">
            <h2>Update Stock</h2>
            <button type="button" id="close-stock-modal">&times;</button>
        </div>

        <form id="stock-update-form">

            <p id="stock-product-name"></p>

            <div class="form-group">
                <label for="new-stock-quantity">
                    New Stock Quantity
                </label>

                <input
                    type="number"
                    id="new-stock-quantity"
                    min="0"
                    step="1"
                    required
                >
            </div>

            <div class="admin-modal-actions">
                <button type="button" id="cancel-stock-update">
                    Cancel
                </button>

                <button type="submit" id="confirm-stock-update">
                    Update Stock
                </button>
            </div>

        </form>

    </div>

</div>


    </main>

    <!-- FIREBASE AND ADMIN SCRIPTS -->

    <script src="../../js/firebase/firebase-config.js"></script>
    <script src="../../js/firebase/rest-client.js"></script>
    <script src="../../js/services/product-service.js"></script>
    <script src="../../js/auth/auth-service.js"></script>
    <script src="../../js/auth/session-service.js"></script>
    <script src="../../js/admin/admin-guard.js"></script>
    <script src="../../js/admin/inventory.js"></script>

</body>

</html>
