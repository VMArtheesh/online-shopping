
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Reset your KARTO account password.">
    <title>Forgot Password | KARTO</title>

    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/auth.css">
</head>
<body>

    <main class="auth-layout">

        <section class="auth-brand-panel">

            <a href="../../index.html" class="auth-logo">KARTO</a>

            <div class="auth-brand-content">
                <p class="auth-eyebrow">ACCOUNT RECOVERY</p>

                <h1>A fresh<br>start.</h1>

                <p class="auth-brand-description">
                    Forgot your password?
                    We'll help you get back to discovering good finds.
                </p>
            </div>

            <p class="auth-brand-footer">
                A little something for everyone.
            </p>

        </section>

        <section class="auth-form-panel">

            <div class="auth-card">

                <div class="auth-heading">
                    <h2>Reset your password</h2>
                    <p>Enter your registered email address and we'll send you a reset link.</p>
                </div>

                <form id="forgot-password-form">

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your registered email"
                            autocomplete="email"
                            required
                        >
                    </div>

                    <p id="reset-message" role="alert"></p>

                    <button type="submit" id="reset-button">
                        Send Reset Link
                    </button>

                </form>

                <p class="auth-switch">
                    Remembered your password?
                    <a href="login.html">Sign in</a>
                </p>

            </div>

        </section>

    </main>
    <script src="../../js/firebase/firebase-config.js"></script>
    <script src="../../js/auth/auth-service.js"></script>
    <script src="../../js/auth/forgot-password-ui.js"></script>

</body>
</html>
